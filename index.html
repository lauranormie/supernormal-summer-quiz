<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supernormal Summer Quiz</title>
<meta name="description" content="A live, host-led summer quiz for the Supernormal team.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9728;&#65039;</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
/* Tokens taken from the Supernormal Framer design system (SN Rebranded + SN accents). */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
button,input{font:inherit;color:inherit}
:root{
  /* SN Rebranded core */
  --white:#ffffff; --ink:#000000;
  --blue-500:#0f8eff; --blue-400:#4da9ff; --blue-300:#bce2ff;
  --blue-700:#0b63b5; --blue-900:#063a6b;
  --g100:#d6d6d8; --g300:#a6a7aa; --g400:#696868; --g500:#48494a;
  /* SN accents */
  --yellow:#eab308; --orange:#f97316; --pink:#ec4899;
  --teal:#14b8a6; --purple:#a855f7; --cyan:#22d3ee;
  /* semantic */
  --right:var(--teal); --wrong:var(--pink); --host:var(--purple); --pts:var(--yellow);
  --bg:#02101e;
  --panel:rgba(255,255,255,.06); --panel-2:rgba(255,255,255,.10);
  --line:rgba(214,214,216,.16); --line-2:rgba(214,214,216,.30);
  --sans:'Inter','Inter var',-apple-system,'Helvetica Neue',system-ui,sans-serif;
  --r:14px;
}
body{
  background:var(--bg); color:var(--white); font-family:var(--sans);
  font-size:16px; line-height:1.6; min-height:100vh;
  font-feature-settings:"cv05" 1,"ss03" 1; -webkit-font-smoothing:antialiased;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(115% 78% at 82% -8%, rgba(15,142,255,.30), transparent 58%),
    radial-gradient(90% 62% at 4% 104%, rgba(34,211,238,.13), transparent 62%),
    linear-gradient(170deg,#063a6b 0%,#04223d 44%,#02101e 100%);
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---- chrome ---- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px clamp(16px,4vw,36px);border-bottom:1px solid var(--line)}
.mark{font-weight:700;font-size:15px;letter-spacing:-.018em}
.mark span{color:var(--blue-400)}
.bar .sp{flex:1}
.chip{font-size:12px;font-weight:500;letter-spacing:.04em;line-height:1.3;
  padding:6px 12px;border:1px solid var(--line-2);border-radius:999px;
  color:var(--g100);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.hot{color:var(--blue-300);border-color:rgba(15,142,255,.55);background:rgba(15,142,255,.12)}
.chip.live{color:var(--teal);border-color:rgba(20,184,166,.5)}
.chip.clock{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip.clock.near{color:var(--yellow);border-color:rgba(234,179,8,.55)}
.chip.clock.over{color:var(--wrong);border-color:rgba(236,72,153,.55)}
.chip.hostchip{color:var(--purple);border-color:rgba(168,85,247,.5)}

main{flex:1;width:100%;max-width:820px;margin:0 auto;
  padding:clamp(24px,5vw,56px) clamp(16px,4vw,36px) 72px;
  display:flex;flex-direction:column;gap:26px}
main.wide{max-width:1020px}

.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--g300)}
h1{font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1.08;
  letter-spacing:-.03em;margin:0;text-wrap:balance}
h2{font-weight:700;font-size:clamp(24px,3.6vw,36px);line-height:1.2;
  letter-spacing:-.025em;margin:0;text-wrap:balance}
.q-text{font-weight:700;font-size:clamp(23px,3.8vw,36px);line-height:1.2;
  letter-spacing:-.025em;margin:0;text-wrap:balance}
p{margin:0;max-width:62ch}
.lede{color:var(--g100);font-size:18px;line-height:1.6}
.muted{color:var(--g300);font-size:14px;line-height:1.5}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:16px}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 24px;border-radius:999px;border:1px solid transparent;
  font-weight:600;font-size:16px;line-height:1.1;cursor:pointer;
  background:var(--blue-500);color:var(--white);
  transition:transform .12s ease,filter .12s ease,background .12s ease}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--white)}
.btn.ghost:hover{border-color:var(--white);filter:none}
.btn.host{background:var(--purple);color:var(--white)}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none;transform:none}
:focus-visible{outline:2px solid var(--blue-400);outline-offset:3px;border-radius:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password]{background:rgba(2,16,30,.65);border:1px solid var(--line-2);border-radius:999px;
  padding:13px 20px;color:var(--white);min-width:min(300px,100%);font-size:16px}
input[type=text]::placeholder,input[type=password]::placeholder{color:var(--g400)}
input[type=text]:focus,input[type=password]:focus{outline:none;border-color:var(--blue-500)}

/* ---- lanes (answers) ---- */
.lanes{display:grid;gap:11px}
@media(min-width:680px){.lanes{grid-template-columns:1fr 1fr}}
.lane{position:relative;display:flex;align-items:center;gap:15px;text-align:left;
  padding:17px 20px 17px 18px;border-radius:var(--r);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--white);
  font-size:17px;line-height:1.35;font-weight:500;
  transition:background .14s ease,border-color .14s ease,transform .1s ease}
.lane::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;
  border-radius:0 4px 4px 0;background:var(--lane,var(--line-2));transition:background .14s ease}
.lane:nth-child(1){--lane:var(--cyan)}
.lane:nth-child(2){--lane:var(--yellow)}
.lane:nth-child(3){--lane:var(--pink)}
.lane:nth-child(4){--lane:var(--purple)}
.lane:hover:not(:disabled){background:var(--panel-2);border-color:var(--line-2)}
.lane:active:not(:disabled){transform:translateY(1px)}
.lane .n{font-size:14px;font-weight:600;color:var(--lane);flex:none;width:16px;
  font-variant-numeric:tabular-nums}
.lane.pick{background:rgba(15,142,255,.16);border-color:var(--blue-500)}
.lane.pick::before{background:var(--blue-500)}
.lane.right{background:rgba(20,184,166,.17);border-color:var(--right)}
.lane.right::before{background:var(--right)}
.lane.right .n{color:var(--right)}
.lane.wrong{background:rgba(236,72,153,.15);border-color:var(--wrong)}
.lane.wrong::before{background:var(--wrong)}
.lane.wrong .n{color:var(--wrong)}
.lane:disabled{cursor:default}
.lane .tag{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;flex:none}
.lane.right .tag{color:var(--right)}
.lane.wrong .tag{color:var(--wrong)}
.lane.pick .tag{color:var(--blue-300)}
.lane.hostkey{border-color:rgba(20,184,166,.5);background:rgba(20,184,166,.09)}
.lane.hostkey::before{background:var(--right)}
.lane.hostkey .tag{color:var(--right)}

/* ---- drawing round ---- */
.padwrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--line-2);
  box-shadow:0 18px 44px rgba(2,16,30,.5);line-height:0}
.padwrap.done{opacity:.75}
.pad{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;background:#fbf6ec}
.padwrap.done .pad{cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inks{display:flex;gap:7px;margin-right:auto}
.nibbtn{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.nibbtn.on{border-color:var(--white);transform:scale(1.12)}
.btn.sm{padding:8px 16px;font-size:14px}
.gallery{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.gallery{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.gallery{grid-template-columns:1fr 1fr 1fr}}
.art{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column}
.art.voted{border-color:var(--blue-500);background:rgba(15,142,255,.10)}
.art img{display:block;width:100%;height:auto;background:#fbf6ec}
.art figcaption{display:flex;align-items:center;gap:9px;padding:11px 13px;font-size:14.5px}
.art .who{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .tally{font-weight:600;color:var(--pts);font-variant-numeric:tabular-nums;white-space:nowrap}
.shot{margin:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-2);
  box-shadow:0 18px 44px rgba(2,16,30,.5)}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{padding:9px 14px;font-size:12px;color:var(--g300);background:var(--panel)}
/* ---- timer ---- */
.timer{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue-500));
  transform-origin:left center;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.timer.done i{transform:scaleX(0);animation:none}

/* ---- leaderboard ---- */
.board{display:flex;flex-direction:column;gap:7px}
.slot{position:relative;display:flex;align-items:center;gap:14px;
  padding:12px 16px;border-radius:11px;background:var(--panel);
  border:1px solid var(--line);overflow:hidden}
.slot .fill{position:absolute;inset:0;right:auto;background:rgba(15,142,255,.16);z-index:0}
.slot > *{position:relative;z-index:1}
.slot .rank{font-size:14px;font-weight:600;color:var(--g300);width:24px;flex:none;
  font-variant-numeric:tabular-nums}
.slot .who{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .pts{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pts)}
.slot.me{border-color:var(--blue-500)}
.slot.me .who::after{content:" (you)";color:var(--blue-300);font-weight:500}
.slot .delta{font-size:13px;font-weight:600;color:var(--right);flex:none;font-variant-numeric:tabular-nums}
.slot.top1 .fill{background:rgba(20,184,166,.20)}
.slot.top1 .pts{color:var(--right)}

.podium{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.podium{grid-template-columns:repeat(3,1fr);align-items:end}
  .pod:nth-child(1){order:2}.pod:nth-child(2){order:1}.pod:nth-child(3){order:3}}
.pod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.pod .medal{font-size:26px;line-height:1}
.pod .nm{font-weight:700;font-size:20px;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-size:15px;font-weight:600;color:var(--pts);font-variant-numeric:tabular-nums}
.pod.g{border-color:var(--right);background:rgba(20,184,166,.12)}
@media(min-width:640px){.pod.g{padding-block:34px}}

.intro{display:flex;gap:clamp(20px,4vw,40px);align-items:center;flex-wrap:wrap}
.introtext{flex:1 1 300px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hero{flex:0 0 auto;width:min(240px,100%);height:auto;border-radius:18px;
  border:1px solid var(--line);display:block;
  box-shadow:0 18px 44px rgba(2,16,30,.55)}
.hero.s{width:min(150px,100%)}
@media(max-width:620px){.hero,.hero.s{width:160px;margin:0 auto}}
.field{display:flex;flex-direction:column;gap:10px}
.field input[type=text],.field input[type=password]{width:100%}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.emo{width:46px;height:46px;border-radius:12px;font-size:22px;line-height:1;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s ease,border-color .12s ease,transform .1s ease}
.emo:hover:not(:disabled){background:var(--panel-2);transform:translateY(-1px)}
.emo.on{border-color:var(--blue-500);background:rgba(15,142,255,.20)}
.emo:disabled{opacity:.4;cursor:not-allowed}
.av{flex:none;line-height:1;font-size:17px}
.pill .av{font-size:15px}
.av.big{font-size:26px;line-height:1}
.track{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.track .ico{font-size:19px;line-height:1;flex:none}
.track .meta{flex:1;min-width:170px;font-size:15px;line-height:1.4}
.track .meta b{font-weight:600;display:block}
.track .meta span{color:var(--g300);font-size:13.5px}
.track a{color:var(--blue-300);font-weight:600;font-size:14px;text-decoration:none;
  border:1px solid rgba(15,142,255,.5);padding:8px 16px;border-radius:999px;white-space:nowrap}
.track a:hover{background:rgba(15,142,255,.14);color:var(--white)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:15px;padding:7px 14px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line);display:flex;align-items:center;gap:8px}
.pill.on{border-color:var(--blue-500);color:var(--blue-300)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--g400);flex:none}
.pill.on .dot{background:var(--blue-500)}

.note{border-left:3px solid var(--blue-500);padding:2px 0 2px 16px;color:var(--g100);font-size:16px}
.note b{color:var(--white);font-weight:600}
.banner{background:rgba(236,72,153,.12);border:1px solid rgba(236,72,153,.42);
  border-radius:11px;padding:13px 17px;font-size:15px;color:var(--white)}
.hostbox{border:1px dashed rgba(168,85,247,.5);border-radius:var(--r);padding:16px 18px;
  display:flex;flex-direction:column;gap:12px;background:rgba(168,85,247,.07)}
.hostbox .lbl{font-size:12px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--purple)}
footer{padding:22px clamp(16px,4vw,36px) 34px;border-top:1px solid var(--line);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--g300)}
footer button{background:none;border:none;color:var(--g300);cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:0;font-size:14px}
footer button:hover{color:var(--white)}
.stat{display:flex;gap:26px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--g300)}
.stat .v{font-weight:800;font-size:28px;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.v.good{color:var(--right)} .v.brand{color:var(--blue-400)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="data.js?v=43"></script>
<script src="app.js?v=43"></script>
</body>
</html>
